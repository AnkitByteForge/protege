[project]
name = "protege-authoring"
version = "0.2.0"
description = "PROTÉGÉ offline authoring tools (roadmap P3: content loading, deterministic validation, and manifest reporting for the misconception library and item bank). The anthropic SDK + Fable 5.1 drafting workflow is a separate, human-invoked step; nothing here calls a network LLM."
requires-python = ">=3.12"
dependencies = ["protege-contracts", "pydantic>=2.10"]

[project.scripts]
protege-authoring = "protege.authoring.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]

[tool.uv.sources]
protege-contracts = { workspace = true }
