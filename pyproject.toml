[project]
name = "protege"
version = "0.1.0"
description = "PROTÉGÉ — AI-native learning system (Learn → Teach → Prove). Workspace root."
requires-python = ">=3.12"
# The virtual root aggregates every workspace member so a single `uv sync`
# installs the whole Python monorepo into one environment.
dependencies = [
    "protege-session",
    "protege-contracts",
    "protege-authoring",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/session",
    "packages/contracts",
    "tools/authoring",
]

[tool.uv.sources]
protege-session = { workspace = true }
protege-contracts = { workspace = true }
protege-authoring = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["services/session/tests", "packages/contracts/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# "docs" is excluded so `ruff format` never rewrites the source-of-truth
# documents (it formats Python code fences inside Markdown).
extend-exclude = ["apps/web", "services/session/migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["protege"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "services/session/src",
    "packages/contracts/src",
    "tools/authoring/src",
]
explicit_package_bases = true
exclude = ["migrations"]

[tool.pydantic.mypy]
init_forbid_extra = true
init_typed = true
