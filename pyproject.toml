[project]
name = "protege"
version = "0.1.0"
description = "PROTÉGÉ — AI-native learning system (Learn → Teach → Prove). Workspace root."
requires-python = ">=3.12"
# The virtual root aggregates every workspace member so a single `uv sync`
# installs the whole Python monorepo into one environment.
dependencies = [
    "protege-session",
    "protege-contracts",
    "protege-authoring",
    "protege-learning-engine",
    "protege-llm",
    "protege-roles",
    "protege-session-fsm",
    "protege-thin-thread",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/session",
    "packages/contracts",
    "tools/authoring",
    "packages/learning-engine",
    "packages/llm",
    "packages/roles",
    "packages/session-fsm",
    "packages/thin-thread",
]

[tool.uv.sources]
protege-session = { workspace = true }
protege-contracts = { workspace = true }
protege-authoring = { workspace = true }
protege-learning-engine = { workspace = true }
protege-llm = { workspace = true }
protege-roles = { workspace = true }
protege-session-fsm = { workspace = true }
protege-thin-thread = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = [
    "services/session/tests",
    "packages/contracts/tests",
    "packages/learning-engine/tests",
    "packages/llm/tests",
    "packages/roles/tests",
    "tools/authoring/tests",
    "packages/session-fsm/tests",
    "packages/thin-thread/tests",
]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# "docs" is excluded so `ruff format` never rewrites the source-of-truth
# documents (it formats Python code fences inside Markdown).
extend-exclude = ["apps/web", "services/session/migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Hand-authored pedagogical content (stems, Sprout utterances, cognitive-origin
# explanations, citations) as Python data: wrapping these natural-language
# strings to 100 columns would only hurt human reviewability (roadmap P3:
# "Generated content must be human-reviewable"), so line length is exempted
# for this one data module. It is not a runtime package.
"tools/authoring/src/protege/authoring/seed_fractions_v1.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["protege"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "services/session/src",
    "packages/contracts/src",
    "tools/authoring/src",
    "packages/learning-engine/src",
    "packages/llm/src",
    "packages/roles/src",
    "packages/session-fsm/src",
    "packages/thin-thread/src",
]
explicit_package_bases = true
exclude = ["migrations"]

# packages/contracts, packages/llm, and packages/learning-engine have no
# py.typed marker yet, so mypy treats each as an untyped installed
# dependency for any *other* package that imports it (tools/authoring was
# the first, for packages/contracts; packages/roles, P6, is the first to
# cross-import packages/llm and packages/learning-engine). Adding those
# marker files belongs to packages this branch must not touch, so the
# import-untyped warning is suppressed here instead of duplicating each
# package's own module path into this config (which would conflict with
# its entry in `files` above).
[[tool.mypy.overrides]]
module = ["protege.contracts", "protege.llm", "protege.learning_engine"]
ignore_missing_imports = true

# protege.authoring has no py.typed marker either, and unlike
# packages/contracts, tools/authoring/src/protege/authoring/__init__.py
# does not re-export `load_content_pack`/`ContentPack` at the top level, so
# packages/roles/src/protege/roles/golden_set.py (P6) must import the
# `.loader` submodule directly -- every other cross-package import in this
# workspace goes through a top-level `__init__.py` instead, which the
# `protege.contracts` override above already covers without needing a
# submodule-specific entry.
[[tool.mypy.overrides]]
module = "protege.authoring.loader"
ignore_missing_imports = true

# Same situation as protege.contracts above, now that packages/roles (P5)
# is the first package to cross-import protege.authoring, protege.llm, and
# protege.learning_engine's submodules directly (e.g. protege.llm.router,
# protege.authoring.loader) rather than only being consumed from their own
# tests. None of the three has a py.typed marker either, and adding one
# belongs to packages this branch must not touch (packages/learning-engine,
# packages/llm) or that predate P5 (tools/authoring).
[[tool.mypy.overrides]]
module = ["protege.authoring.*", "protege.learning_engine.*", "protege.llm.*"]
ignore_missing_imports = true

# Same situation as above: packages/learning-engine has no py.typed marker.
# P7's session-fsm imports it directly, so keep this package-level override.
[[tool.mypy.overrides]]
module = "protege.learning_engine"
ignore_missing_imports = true

# P8's thin thread (packages/thin-thread) is the first package to
# cross-import protege.session's submodules directly
# (protege.session.machine, protege.session.orchestrator) and
# protege.roles's submodules directly (protege.roles.sprout,
# protege.roles.diagnostician, protege.roles.beliefs) -- neither
# packages/session-fsm nor packages/roles has a py.typed marker, and
# adding one belongs to those packages' own phases (P7, P5/P6), not P8.
[[tool.mypy.overrides]]
module = ["protege.session", "protege.session.*", "protege.roles", "protege.roles.*"]
ignore_missing_imports = true

[tool.pydantic.mypy]
init_forbid_extra = true
init_typed = true