[project]
name = "protege-policy"
version = "0.1.0"
description = "PROTÉGÉ policy engine, safety shield & trajectory log (roadmap P11). Zero LLM calls; rules + a deterministic, unconditional safety shield over the 14-dim context vector / 13-action set (docs/PROTEGE_ARCHITECTURE.md §11.2, §11.3)."
requires-python = ">=3.12"
dependencies = [
    "protege-contracts",
    "protege-learning-engine",
    "protege-session-fsm",
]

[tool.uv.sources]
protege-contracts = { workspace = true }
protege-learning-engine = { workspace = true }
protege-session-fsm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]
