[project]
name = "protege-llm"
version = "0.1.0"
description = "PROTÉGÉ provider layer & ModelRouter (roadmap P4). LLMProvider protocol, NvidiaProvider, FakeProvider — no anthropic dependency (docs/DECISIONS.md D7)."
requires-python = ">=3.12"
dependencies = [
    "protege-contracts",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]

[tool.uv.sources]
protege-contracts = { workspace = true }
