[project]
name = "protege-session-fsm"
version = "0.1.0"
description = "PROTÉGÉ session FSM & orchestrator — 21-state deterministic session spine (roadmap P7). Plain Python; no XState, no LangGraph (docs/PROTEGE_ENGINEERING_ADDENDUM.md §3.9)."
requires-python = ">=3.12"
dependencies = [
    "protege-contracts",
    "protege-learning-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]
