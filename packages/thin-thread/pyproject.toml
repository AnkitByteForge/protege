[project]
name = "protege-thin-thread"
version = "0.1.0"
description = "PROTÉGÉ P8 — the thin vertical thread (roadmap P8: Session FSM -> Sprout -> Diagnostician -> deterministic learning update -> independent verification -> mastery decision -> evidence-backed claim). Entry point: `python -m protege.thin_thread`."
requires-python = ">=3.12"
dependencies = [
    "protege-contracts",
    "protege-learning-engine",
    "protege-llm",
    "protege-roles",
    "protege-session-fsm",
    "protege-authoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]

[tool.uv.sources]
protege-contracts = { workspace = true }
protege-learning-engine = { workspace = true }
protege-llm = { workspace = true }
protege-roles = { workspace = true }
protege-session-fsm = { workspace = true }
protege-authoring = { workspace = true }
