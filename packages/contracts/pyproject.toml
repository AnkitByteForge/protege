[project]
name = "protege-contracts"
version = "0.1.0"
description = "PROTÉGÉ shared contracts — Pydantic models + generated TS types."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]
