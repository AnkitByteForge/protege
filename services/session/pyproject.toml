[project]
name = "protege-session"
version = "0.1.0"
description = "PROTÉGÉ session service — FastAPI skeleton (P0: /healthz, settings, structured logging, Alembic baseline)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "opentelemetry-sdk>=1.29",
    "pgvector>=0.3",
    "protege-contracts",
    "protege-session-fsm",
    "protege-llm",
    "protege-thin-thread",
]

[tool.uv.sources]
protege-contracts = { workspace = true }
protege-session-fsm = { workspace = true }
protege-llm = { workspace = true }
protege-thin-thread = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protege"]
